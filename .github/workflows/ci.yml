name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get latest deployment ID before trigger
        id: before
        run: |
          JSON=$(curl -s "${{ secrets.DOKPLOY_URL }}/api/compose.one?composeId=${{ secrets.DOKPLOY_APP_ID }}" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}")
          ID=$(echo "$JSON" | jq -r '[.deployments[].deploymentId][0] // "none"')
          echo "before=$ID" >> "$GITHUB_OUTPUT"

      - name: Trigger Dokploy deployment
        run: |
          curl -fs -X POST "${{ secrets.DOKPLOY_URL }}/api/compose.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"composeId": "${{ secrets.DOKPLOY_APP_ID }}"}'

      - name: Poll for completion
        shell: bash
        run: |
          URL="${{ secrets.DOKPLOY_URL }}/api/compose.one?composeId=${{ secrets.DOKPLOY_APP_ID }}"
          AUTH="x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}"
          BEFORE="${{ steps.before.outputs.before }}"

          for i in $(seq 1 30); do
            sleep 10
            DATA=$(curl -s "$URL" -H "$AUTH")
            LATEST_ID=$(echo "$DATA" | jq -r '[.deployments[].deploymentId][0] // "none"')
            LATEST_STATUS=$(echo "$DATA" | jq -r '[.deployments[].status][0] // "unknown"')

            if [ "$LATEST_ID" != "$BEFORE" ]; then
              echo "Attempt $i: deployment $LATEST_ID status = $LATEST_STATUS"
              if [ "$LATEST_STATUS" = "done" ]; then
                echo "Deployment succeeded"
                exit 0
              elif [ "$LATEST_STATUS" = "error" ]; then
                echo "Deployment failed"
                exit 1
              fi
            else
              echo "Attempt $i: waiting for new deployment to appear..."
            fi
          done
          echo "Timed out waiting for deployment"
          exit 1


