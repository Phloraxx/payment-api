name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Dokploy auto-deploy
        shell: bash
        env:
          URL: ${{ secrets.DOKPLOY_URL }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_APP_ID }}
          TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            sleep 10
            DATA=$(curl -s "${URL}/api/compose.one?composeId=${COMPOSE_ID}" -H "x-api-key: ${TOKEN}")
            LATEST_STATUS=$(echo "$DATA" | jq -r '[.deployments[].status][0] // "unknown"')
            echo "Attempt ${i}: latest deployment status = ${LATEST_STATUS}"
            if [ "${LATEST_STATUS}" = "done" ]; then
              echo "Deployment succeeded"
              exit 0
            elif [ "${LATEST_STATUS}" = "error" ]; then
              echo "Deployment failed"
              exit 1
            fi
          done
          echo "Timed out waiting for deployment"
          exit 1
