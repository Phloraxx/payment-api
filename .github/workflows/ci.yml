name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: nhridoy/dokploy-deploy-action@v1
        with:
          auth_token: ${{ secrets.DOKPLOY_API_TOKEN }}
          app_id: ${{ secrets.DOKPLOY_APP_ID }}
          dokploy_url: https://docker.mulearnscet.in
          deployment_type: compose
