name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deployment
        run: |
          curl -s -X POST "https://docker.mulearnscet.in/api/compose.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"composeId": "${{ secrets.DOKPLOY_APP_ID }}"}' \
            -w "\nHTTP %{http_code}"

      - name: Poll for completion
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          URL="https://docker.mulearnscet.in/api/compose.one?composeId=${{ secrets.DOKPLOY_APP_ID }}"
          AUTH="x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}"

          for i in $(seq 1 30); do
            sleep 10
            DATA=$(curl -s "$URL" -H "$AUTH")
            STATUS=$(echo "$DATA" | jq -r --arg sha "$SHA" '
              [.deployments[] | select(.description | contains("Commit: \($sha)")) | .status][0] // "pending"
            ')
            echo "Attempt $i: deployment status = $STATUS"
            if [ "$STATUS" = "done" ]; then
              echo "Deployment succeeded"
              exit 0
            elif [ "$STATUS" = "error" ]; then
              ERROR_MSG=$(echo "$DATA" | jq -r --arg sha "$SHA" '
                [.deployments[] | select(.description | contains("Commit: \($sha)")) | .errorMessage][0] // "Unknown error"
              ')
              echo "Deployment failed: $ERROR_MSG"
              exit 1
            fi
          done
          echo "Timed out waiting for deployment"
          exit 1
