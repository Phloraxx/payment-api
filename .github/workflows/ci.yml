name: CI

on:
  push:
    branches: [main, rebuild-pocketbase]
  pull_request:

permissions:
  contents: read

# PayGate v4 is the production surface; keep the required gate independent of legacy cleanup.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend dependency vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        with:
          scan-args: |-
            -L package-lock.json

      - name: Frontend typecheck
        run: npm run typecheck:v4

      - name: Frontend production build
        run: npm run build:v4

      - name: Go formatting check
        shell: bash
        run: test -z "$(gofmt -l cmd/paygate-v4 cmd/paygate-v4-migrate internal/v4 internal/money internal/processlock internal/v4web)"

      - name: Diff whitespace check
        run: git diff --check

      - name: V4 Go tests
        run: go test -count=1 ./cmd/paygate-v4 ./cmd/paygate-v4-migrate ./internal/v4/... ./internal/money ./internal/processlock ./internal/v4web

      - name: V4 Go race tests
        run: go test -race -p=1 -timeout=20m -count=1 ./cmd/paygate-v4 ./cmd/paygate-v4-migrate ./internal/v4/... ./internal/money ./internal/processlock ./internal/v4web

      - name: V4 Go vet
        run: go vet ./cmd/paygate-v4 ./cmd/paygate-v4-migrate ./internal/v4/... ./internal/money ./internal/processlock ./internal/v4web

      - name: V4 static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./cmd/paygate-v4 ./cmd/paygate-v4-migrate ./internal/v4/... ./internal/money ./internal/processlock ./internal/v4web

      - name: V4 Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/paygate-v4 ./cmd/paygate-v4-migrate ./internal/v4/... ./internal/money ./internal/processlock ./internal/v4web

      - name: Build PayGate v4 container
        run: docker build --pull -f Dockerfile.v4 -t paygate-v4-ci:${{ github.sha }} .
