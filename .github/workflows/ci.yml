name: CI

on:
  push:
    branches: [main, rebuild-pocketbase]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend dependency audit
        run: npm audit --audit-level=high

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend production build
        run: npm run build

      - name: Go formatting check
        shell: bash
        run: test -z "$(gofmt -l cmd internal migrations)"

      - name: Diff whitespace check
        run: git diff --check

      - name: Go tests
        run: go test -count=1 ./...

      - name: Go race tests
        # PocketBase integration fixtures are CPU-heavy under -race. Run packages
        # serially with an explicit timeout to avoid contention-driven false failures.
        run: go test -race -p=1 -timeout=20m -count=1 ./internal/...

      - name: Go vet
        run: go vet ./...

      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build production container
        run: docker build --pull -t paygate-ci:${{ github.sha }} .
