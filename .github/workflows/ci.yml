name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deployment
        run: |
          curl -s -X POST "https://docker.mulearnscet.in/api/compose.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"composeId": "${{ secrets.DOKPLOY_APP_ID }}"}' \
            -w "\nHTTP %{http_code}"

      - name: Poll for completion
        shell: bash
        run: |
          URL="https://docker.mulearnscet.in/api/compose.one?composeId=${{ secrets.DOKPLOY_APP_ID }}"
          AUTH="x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}"

          BEFORE=$(curl -s "$URL" -H "$AUTH" | jq -r '[.deployments[].deploymentId][0] // "none"')
          echo "Latest deployment before trigger: $BEFORE"

          for i in $(seq 1 30); do
            sleep 10
            DATA=$(curl -s "$URL" -H "$AUTH")
            LATEST_ID=$(echo "$DATA" | jq -r '[.deployments[].deploymentId][0] // "none"')
            LATEST_STATUS=$(echo "$DATA" | jq -r '[.deployments[].status][0] // "unknown"')

            if [ "$LATEST_ID" != "$BEFORE" ]; then
              echo "Attempt $i: deployment $LATEST_ID status = $LATEST_STATUS"
              if [ "$LATEST_STATUS" = "done" ]; then
                echo "Deployment succeeded"
                exit 0
              elif [ "$LATEST_STATUS" = "error" ]; then
                ERROR_MSG=$(echo "$DATA" | jq -r '[.deployments[].errorMessage][0] // "Unknown error"')
                echo "Deployment failed: $ERROR_MSG"
                exit 1
              fi
            else
              echo "Attempt $i: waiting for new deployment to appear..."
            fi
          done
          echo "Timed out waiting for deployment"
          exit 1
