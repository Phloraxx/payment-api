name: PR19 client event ownership fix

on:
  push:
    branches: [hotfix/gmessages-google-reauth]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/gmessages-google-reauth
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Apply client event ownership guard
        shell: python
        run: |
          from pathlib import Path

          path = Path('internal/gmessages/manager.go')
          source = path.read_text()
          old = '''func (m *Manager) newClient(session *libgm.AuthData) *libgm.Client {\n\tclient := libgm.NewClient(session, nil, m.logger.With().Str("component", "libgm").Logger())\n\tclient.SetEventHandler(m.handleEvent)\n\treturn client\n}\n\nfunc (m *Manager) handleEvent(raw any) {\n'''
          new = '''func (m *Manager) newClient(session *libgm.AuthData) *libgm.Client {\n\tclient := libgm.NewClient(session, nil, m.logger.With().Str("component", "libgm").Logger())\n\tclient.SetEventHandler(func(raw any) {\n\t\tm.handleClientEvent(client, raw)\n\t})\n\treturn client\n}\n\nfunc (m *Manager) handleClientEvent(client *libgm.Client, raw any) {\n\tm.mu.RLock()\n\tcurrent := m.client == client\n\tm.mu.RUnlock()\n\tif !current {\n\t\tm.logger.Debug().Type("event_type", raw).Msg("ignoring Google Messages event from retired client")\n\t\treturn\n\t}\n\tm.handleEvent(raw)\n}\n\nfunc (m *Manager) handleEvent(raw any) {\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one newClient block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
      - name: Format
        run: gofmt -w internal/gmessages/manager.go
      - name: Commit only manager fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/gmessages/manager.go
          git diff --cached --check
          git commit -m "Ignore events from retired Google Messages clients"
          git push origin HEAD:hotfix/gmessages-google-reauth
