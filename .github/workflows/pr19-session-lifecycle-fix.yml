name: PR19 session lifecycle fix

on:
  push:
    branches: [hotfix/gmessages-google-reauth]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/gmessages-google-reauth
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Apply pairing-state and retirement fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path('internal/gmessages/manager.go')
          source = path.read_text()
          replacements = [
            (
              '''\tif !validSession(session) {\n\t\tm.status = Status{Enabled: true, State: "unpaired"}\n\t\treturn m\n\t}\n\tm.session = session\n\tm.status = Status{\n\t\tEnabled:       true,\n\t\tState:         "disconnected",\n\t\tPaired:        true,\n\t\tPairingMethod: sessionPairingMethod(session),\n\t\tAccountEmail:  sessionAccountEmail(session),\n\t}\n''',
              '''\tif !validPairingSession(session) {\n\t\tm.status = Status{Enabled: true, State: "unpaired"}\n\t\treturn m\n\t}\n\tm.session = session\n\tstate := "disconnected"\n\tlastError := ""\n\tif session.IsGoogleAccount() && !googleSessionHasRequiredCookies(session) {\n\t\tstate = "reauth_required"\n\t\tlastError = googleReauthRequiredMessage\n\t}\n\tm.status = Status{\n\t\tEnabled:       true,\n\t\tState:         state,\n\t\tPaired:        true,\n\t\tPairingMethod: sessionPairingMethod(session),\n\t\tAccountEmail:  sessionAccountEmail(session),\n\t\tLastError:     lastError,\n\t}\n'''
            ),
            (
              '''\tif client != nil {\n\t\tclient.Disconnect()\n\t}\n}\n\nfunc (m *Manager) Status() Status {\n''',
              '''\tm.retireClient(client)\n}\n\nfunc (m *Manager) Status() Status {\n'''
            ),
            (
              '''\t\tif client != nil {\n\t\t\tclient.Disconnect()\n\t\t}\n\t\ttimer := time.NewTimer(2 * time.Second)\n''',
              '''\t\tm.retireClient(client)\n\t\ttimer := time.NewTimer(2 * time.Second)\n'''
            ),
            (
              '''\tclient := m.client\n\tpaired := validSession(m.session)\n\tstate := m.status.State\n\tm.mu.RUnlock()\n\tif !paired {\n\t\treturn errors.New("google messages is not paired")\n\t}\n\tif state == "reauth_required" || state == "reauthenticating" {\n''',
              '''\tclient := m.client\n\tpairingExists := validPairingSession(m.session)\n\tauthReady := validSession(m.session)\n\tstate := m.status.State\n\tm.mu.RUnlock()\n\tif !pairingExists {\n\t\treturn errors.New("google messages is not paired")\n\t}\n\tif state == "reauth_required" || state == "reauthenticating" || !authReady {\n'''
            ),
            (
              '''\tif validSession(m.session) {\n\t\tm.mu.Unlock()\n\t\treturn "", "", errors.New("google messages is already paired; unpair it before starting a new pairing")\n\t}\n''',
              '''\tif validPairingSession(m.session) {\n\t\tm.mu.Unlock()\n\t\treturn "", "", errors.New("google messages is already paired; unpair it before starting a new pairing")\n\t}\n'''
            ),
            (
              '''\tif oldClient != nil {\n\t\toldClient.Disconnect()\n\t}\n\n\tif err := client.FetchConfig(pairCtx); err != nil {\n''',
              '''\tm.retireClient(oldClient)\n\n\tif err := client.FetchConfig(pairCtx); err != nil {\n'''
            ),
            (
              '''func (m *Manager) failPairing(client *libgm.Client, err error) {\n\tif client != nil {\n\t\tclient.Disconnect()\n\t}\n\tm.mu.Lock()\n\tdefer m.mu.Unlock()\n\tif m.client != client {\n\t\treturn\n\t}\n\tif m.pairCancel != nil {\n\t\tm.pairCancel()\n\t}\n\tm.pairCancel = nil\n\tm.client = nil\n\tm.session = nil\n\tm.status = Status{Enabled: m.cfg.GMessagesEnabled, State: "unpaired"}\n\tif err != nil {\n\t\tm.status.LastError = err.Error()\n\t}\n}\n''',
              '''func (m *Manager) failPairing(client *libgm.Client, err error) {\n\tm.mu.Lock()\n\tif m.client != client {\n\t\tm.mu.Unlock()\n\t\treturn\n\t}\n\tif m.pairCancel != nil {\n\t\tm.pairCancel()\n\t}\n\tm.pairCancel = nil\n\tm.client = nil\n\tm.session = nil\n\tm.status = Status{Enabled: m.cfg.GMessagesEnabled, State: "unpaired"}\n\tif err != nil {\n\t\tm.status.LastError = err.Error()\n\t}\n\tm.mu.Unlock()\n\tm.retireClient(client)\n}\n'''
            ),
            (
              '''\tif validSession(m.session) {\n\t\tm.mu.Unlock()\n\t\treturn "", errors.New("google messages is already paired; unpair it before starting a new pairing")\n\t}\n''',
              '''\tif validPairingSession(m.session) {\n\t\tm.mu.Unlock()\n\t\treturn "", errors.New("google messages is already paired; unpair it before starting a new pairing")\n\t}\n'''
            ),
            (
              '''\tif oldClient != nil {\n\t\toldClient.Disconnect()\n\t}\n\tqrURL, err := client.StartLogin()\n''',
              '''\tm.retireClient(oldClient)\n\tqrURL, err := client.StartLogin()\n'''
            ),
            (
              '''\twasPaired := validSession(m.session)\n''',
              '''\twasPaired := validPairingSession(m.session)\n'''
            ),
            (
              '''\t\tclient.Disconnect()\n\t}\n\tif err := os.Remove(m.cfg.GMessagesSessionPath); err != nil && !errors.Is(err, os.ErrNotExist) {\n''',
              '''\t\tm.retireClient(client)\n\t}\n\tif err := os.Remove(m.cfg.GMessagesSessionPath); err != nil && !errors.Is(err, os.ErrNotExist) {\n'''
            ),
            (
              '''\tif client != nil {\n\t\tclient.Disconnect()\n\t}\n\t_ = os.Remove(m.cfg.GMessagesSessionPath)\n}\n''',
              '''\tif client != nil {\n\t\tclient.Disconnect()\n\t\tgo m.retireClient(client)\n\t}\n\t_ = os.Remove(m.cfg.GMessagesSessionPath)\n}\n'''
            ),
            (
              '''func validSession(session *libgm.AuthData) bool {\n\treturn session != nil &&\n\t\tgoogleSessionHasRequiredCookies(session) &&\n\t\tsession.Browser != nil &&\n\t\tsession.Mobile != nil &&\n\t\tsession.RequestCrypto != nil &&\n\t\tlen(session.RequestCrypto.AESKey) == 32 &&\n\t\tlen(session.RequestCrypto.HMACKey) > 0 &&\n\t\tsession.RefreshKey != nil &&\n\t\tlen(session.RefreshKey.D) > 0 &&\n\t\tlen(session.RefreshKey.X) > 0 &&\n\t\tlen(session.RefreshKey.Y) > 0 &&\n\t\tlen(session.TachyonAuthToken) > 0\n}\n''',
              '''func validSession(session *libgm.AuthData) bool {\n\treturn validPairingSession(session) && googleSessionHasRequiredCookies(session)\n}\n'''
            ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one replacement, found {source.count(old)} for snippet: {old[:80]!r}')
              source = source.replace(old, new, 1)
          path.write_text(source)
      - name: Format and test targeted package
        run: |
          gofmt -w internal/gmessages/manager.go
          go test ./internal/gmessages
      - name: Commit lifecycle fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/gmessages/manager.go
          git diff --cached --check
          git commit -m "Preserve Google pairing across auth expiry"
          git push origin HEAD:hotfix/gmessages-google-reauth
